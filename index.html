<script>
'use strict';
/* ============ Utilitaires ============ */
const $ = (s, r = document) => r.querySelector(s);
const uid = () => Math.random().toString(36).slice(2, 9);
const clone = o => JSON.parse(JSON.stringify(o));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const num = v => { if (typeof v === 'number') return v; const n = parseFloat(String(v ?? '').replace(/\s/g, '').replace(',', '.')); return isFinite(n) ? n : NaN; };
const dv = v => (typeof v === 'number') ? (isFinite(v) ? String(v).replace('.', ',') : '') : (v ?? '');
const _nf = {};
const fmt = (x, d = 3) => { if (Math.abs(x) < 1e-12) x = 0; return (_nf[d] || (_nf[d] = new Intl.NumberFormat('fr-FR', { maximumFractionDigits: d }))).format(x); };
const fmtC = x => isFinite(x) ? fmt(+(+x).toPrecision(4), 12) : '—';
const fmtMW = x => isFinite(x) ? fmt(+x, 2) : '—';
const fmtPct = x => isFinite(x) ? fmt(+(+x).toPrecision(3), 4) : '—';
function fmtVol(ml) {
  const a = Math.abs(ml);
  if (a >= 1000) return fmt(ml / 1000, 3) + ' L';
  if (a >= 1) return fmt(ml, a >= 100 ? 1 : a >= 10 ? 2 : 3) + ' mL';
  const ul = ml * 1000, b = Math.abs(ul);
  return fmt(ul, b >= 10 ? 1 : b >= 1 ? 2 : 3) + ' µL';
}
function fmtMass(g) {
  if (Math.abs(g) >= 1) return fmt(g, 4) + ' g';
  const mg = g * 1000;
  if (Math.abs(mg) >= 1) return fmt(mg, Math.abs(mg) >= 100 ? 1 : 2) + ' mg';
  return fmt(g * 1e6, 1) + ' µg';
}
const SUBS = '₀₁₂₃₄₅₆₇₈₉';
const subscript = s => String(s || '').replace(/([A-Za-z\)\]])(\d+)/g, (m, a, d) => a + [...d].map(c => SUBS[c]).join(''));
const norm = s => String(s || '').toLowerCase().replace(/[₀-₉]/g, c => SUBS.indexOf(c)).normalize('NFD').replace(/[\u0300-\u036f]/g, '');

/* ============ Unités ============ */
// mol : base M ; mass : base mg/mL (= g/L) ; vv : % v/v ; x : facteur ; pct : % générique (C1V1)
const CU = {
  'M': { f: 'mol', k: 1 }, 'mM': { f: 'mol', k: 1e-3 }, 'µM': { f: 'mol', k: 1e-6 }, 'nM': { f: 'mol', k: 1e-9 },
  'mg/mL': { f: 'mass', k: 1 }, 'µg/mL': { f: 'mass', k: 1e-3 }, '% p/v': { f: 'mass', k: 10 },
  '% v/v': { f: 'vv', k: 1 }, 'X': { f: 'x', k: 1 }, '%': { f: 'pct', k: 1 }
};
const UNIT_LIST = ['M', 'mM', 'µM', 'nM', 'mg/mL', 'µg/mL', '% p/v', '% v/v', 'X'];
const SOLID_UNITS = ['M', 'mM', 'µM', 'mg/mL', '% p/v'];
const C1_UNITS = ['M', 'mM', 'µM', 'nM', 'mg/mL', 'µg/mL', '%', 'X'];
const VU = { 'µL': 1e-3, 'mL': 1, 'L': 1000 };
function conv(v, from, to, mw) {
  const a = CU[from], b = CU[to];
  if (!a || !b || !isFinite(v)) return null;
  if (a.f === b.f) return v * a.k / b.k;
  if (mw > 0) {
    if (a.f === 'mol' && b.f === 'mass') return v * a.k * mw / b.k;   // M × g/mol = g/L = mg/mL
    if (a.f === 'mass' && b.f === 'mol') return v * a.k / mw / b.k;
  }
  return null;
}

/* ============ Données par défaut ============ */
const DEF_REAGENTS = [
  { id: 'r_na2hpo4', name: 'Phosphate disodique', formula: 'Na₂HPO₄', forms: [{ l: 'Anhydre', mw: 141.96 }, { l: '·2H₂O', mw: 177.99 }, { l: '·7H₂O', mw: 268.07 }, { l: '·12H₂O', mw: 358.14 }], sel: 0 },
  { id: 'r_nah2po4', name: 'Phosphate monosodique', formula: 'NaH₂PO₄', forms: [{ l: 'Anhydre', mw: 119.98 }, { l: '·H₂O', mw: 137.99 }, { l: '·2H₂O', mw: 156.01 }], sel: 0 },
  { id: 'r_k2hpo4', name: 'Phosphate dipotassique', formula: 'K₂HPO₄', forms: [{ l: 'Anhydre', mw: 174.18 }, { l: '·3H₂O', mw: 228.22 }], sel: 0 },
  { id: 'r_kh2po4', name: 'Phosphate monopotassique', formula: 'KH₂PO₄', forms: [{ l: 'Anhydre', mw: 136.09 }], sel: 0 },
  { id: 'r_nan3', name: 'Azoture de sodium', formula: 'NaN₃', forms: [{ l: 'Anhydre', mw: 65.01 }], sel: 0 },
  { id: 'r_dss', name: 'DSS (référence RMN)', formula: 'C₆H₁₅NaO₃SSi', forms: [{ l: 'Standard', mw: 218.32 }, { l: 'd₆', mw: 224.36 }], sel: 0 },
  { id: 'r_tsp', name: 'TSP (référence RMN)', formula: 'C₆H₉D₄NaO₂Si', forms: [{ l: 'd₄', mw: 172.27 }], sel: 0 },
  { id: 'r_nacl', name: 'Chlorure de sodium', formula: 'NaCl', forms: [{ l: 'Anhydre', mw: 58.44 }], sel: 0 },
  { id: 'r_kcl', name: 'Chlorure de potassium', formula: 'KCl', forms: [{ l: 'Anhydre', mw: 74.55 }], sel: 0 },
  { id: 'r_mgcl2', name: 'Chlorure de magnésium', formula: 'MgCl₂', forms: [{ l: 'Anhydre', mw: 95.21 }, { l: '·6H₂O', mw: 203.30 }], sel: 1 },
  { id: 'r_cacl2', name: 'Chlorure de calcium', formula: 'CaCl₂', forms: [{ l: 'Anhydre', mw: 110.98 }, { l: '·2H₂O', mw: 147.01 }], sel: 1 },
  { id: 'r_tris', name: 'Tris', formula: 'C₄H₁₁NO₃', forms: [{ l: 'Base', mw: 121.14 }, { l: '·HCl', mw: 157.60 }], sel: 0 },
  { id: 'r_hepes', name: 'HEPES', formula: 'C₈H₁₈N₂O₄S', forms: [{ l: 'Acide', mw: 238.30 }, { l: 'Sel Na', mw: 260.29 }], sel: 0 },
  { id: 'r_edta', name: 'EDTA disodique', formula: 'Na₂H₂EDTA', forms: [{ l: 'Anhydre', mw: 336.21 }, { l: '·2H₂O', mw: 372.24 }], sel: 1 },
  { id: 'r_dtt', name: 'DTT', formula: 'C₄H₁₀O₂S₂', forms: [{ l: 'Anhydre', mw: 154.25 }], sel: 0 },
  { id: 'r_tcep', name: 'TCEP·HCl', formula: 'C₉H₁₅O₆P·HCl', forms: [{ l: 'Anhydre', mw: 286.65 }], sel: 0 },
  { id: 'r_d2o', name: 'Oxyde de deutérium', formula: 'D₂O', forms: [{ l: '99,9 % D', mw: 20.03 }], sel: 0, solvent: true, density: 1.107 }
];
const DEF_STOCKS = [
  { id: 's_napi', name: 'Phosphate de sodium pH 6,8', c: 1, u: 'M', solv: 'H2O', mw: '' },
  { id: 's_nan3', name: 'NaN₃', c: 2, u: '% p/v', solv: 'H2O', mw: 65.01 },
  { id: 's_dss', name: 'DSS', c: 50, u: 'mM', solv: 'D2O', mw: 218.32 },
  { id: 's_nacl', name: 'NaCl', c: 5, u: 'M', solv: 'H2O', mw: 58.44 }
];
const DEF_RECIPE = {
  id: 'rc_rmn', name: 'Tampon RMN 5X Phosphate/NaN₃/DSS 50 % D₂O', vol: 10, vu: 'mL', x: 5, d2o: 50,
  comps: [
    { kind: 'stock', ref: 's_napi', c: 20, u: 'mM' },
    { kind: 'stock', ref: 's_nan3', c: 0.02, u: '% p/v' },
    { kind: 'stock', ref: 's_dss', c: 0.1, u: 'mM' }
  ]
};
const emptyDraft = () => ({ name: '', vol: 10, vu: 'mL', x: 1, d2o: 10, comps: [] });
const defFlash = () => ({ c1: '', u1: 'mM', v1: '', vu1: 'µL', c2: '', u2: 'mM', v2: '', vu2: 'mL', mRef: 'r_na2hpo4', mForm: 0, mMw: '', mC: '', mU: 'M', mV: '', mVU: 'mL' });
const recipeToDraft = r => ({ name: r.name, vol: r.vol, vu: r.vu, x: r.x, d2o: r.d2o, comps: r.comps.map(c => ({ ...c, uid: uid() })) });
function defaults() {
  return {
    v: 1, theme: 'dark', tab: 'buf',
    reagents: clone(DEF_REAGENTS), stocks: clone(DEF_STOCKS), recipes: [clone(DEF_RECIPE)],
    draft: recipeToDraft(DEF_RECIPE), flash: defFlash(),
    phos: { c: '50', ph: '7,0', pka: '6,82', cat: 'Na' }
  };
}

/* ============ État & stockage ============ */
const KEY = 'tampons-paillasse.v1';
let S = null, storageOK = true;
try { S = JSON.parse(localStorage.getItem(KEY)); } catch (e) { storageOK = false; }
if (!S || !Array.isArray(S.reagents)) S = defaults();
S.flash = Object.assign(defFlash(), S.flash || {});
S.phos = Object.assign({ c: '50', ph: '7,0', pka: '6,82', cat: 'Na' }, S.phos || {});
S.draft = S.draft && Array.isArray(S.draft.comps) ? S.draft : emptyDraft();
S.draft.comps.forEach(c => { if (!c.uid) c.uid = uid(); });
S.stocks = S.stocks || []; S.recipes = S.recipes || [];
if (!['buf', 'stk', 'rec', 'flash'].includes(S.tab)) S.tab = 'buf';

let saveT = null;
function flush() {
  clearTimeout(saveT);
  try { localStorage.setItem(KEY, JSON.stringify(S)); storageOK = true; }
  catch (e) { if (storageOK) toast('Sauvegarde locale impossible sur ce navigateur'); storageOK = false; }
}
const persist = () => { clearTimeout(saveT); saveT = setTimeout(flush, 200); };
document.addEventListener('visibilitychange', () => { if (document.hidden) flush(); });
window.addEventListener('pagehide', flush);

const ui = { stk: 'stocks' };
const ticks = new Set();
let edit = null, sheetFn = null, pending = null;

const R = id => S.reagents.find(r => r.id === id);
const ST = id => S.stocks.find(s => s.id === id);
const comp = u => S.draft.comps.find(c => c.uid === u);
function rForm(r, i) {
  if (!r) return '(réactif supprimé)';
  const f = r.forms[i] || r.forms[0]; const l = f?.l || '';
  if (l.startsWith('·')) return r.formula + l;
  if (r.forms.length === 1) return r.formula;
  return r.formula + ' ' + l.toLowerCase();
}
const compName = c => c.kind === 'stock' ? (ST(c.ref)?.name || '(mère supprimée)') : rForm(R(c.ref), c.form);

/* ============ Icônes ============ */
const sv = d => `<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
const ICON = {
  beaker: sv('<path d="M9 3h6M10 3v6.5L4.6 18.4A1.7 1.7 0 0 0 6 21h12a1.7 1.7 0 0 0 1.4-2.6L14 9.5V3"/><path d="M7.4 14.5h9.2"/>'),
  rack: sv('<path d="M7 3v12.5a2 2 0 0 0 4 0V3M15 3v12.5a2 2 0 0 0 4 0V3M5 3h8M13 3h8M7 10h4M15 8h4"/>'),
  book: sv('<path d="M6 3h12v18l-6-4-6 4z"/>'),
  bolt: sv('<path d="M13 2 4 14h7l-1 8 9-12h-7l1-8z"/>'),
  gear: sv('<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M2 12h3M19 12h3M4.9 19.1 7 17M17 7l2.1-2.1"/>'),
  plus: sv('<path d="M12 5v14M5 12h14"/>'),
  x: sv('<path d="M6 6l12 12M18 6 6 18"/>'),
  copy: sv('<rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/>'),
  trash: sv('<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-13M9 7V4h6v3"/>'),
  edit: sv('<path d="M4 20h4L19 9l-4-4L4 16v4z"/>'),
  chev: sv('<path d="m9 6 6 6-6 6"/>')
};

/* ============ Calcul du tampon ============ */
const KB = {
  solid: ['Peser', 'text-solid bg-solid/10', 'text-solid'],
  stock: ['Pipeter', 'text-accent bg-accent/10', 'text-accent'],
  d2o: ['Ajouter', 'text-d2o bg-d2o/10', 'text-d2o'],
  h2o: ['Compléter', 'text-muted bg-raised', 'text-ink']
};
function compute(d) {
  const out = { steps: [], warns: [] };
  const Vf = num(d.vol) * (VU[d.vu] || 1);
  if (!(Vf > 0)) { out.fatal = 'Indiquez le volume final.'; return out; }
  const fx = num(d.x) > 0 ? num(d.x) : 1;
  const P = isFinite(num(d.d2o)) ? Math.min(Math.max(num(d.d2o), 0), 100) : 0;
  let sumV = 0, d2oIn = 0, hasSolid = false;
  const solids = [], liquids = [];
  for (const c of d.comps) {
    const tgt = num(c.c), ce = tgt * fx;
    if (c.kind === 'stock') {
      const s = ST(c.ref);
      if (!s) { liquids.push({ key: c.uid, k: 'stock', title: 'Solution mère supprimée', err: 'Retirez ce composant ou recréez la mère.' }); continue; }
      const base = { key: c.uid, k: 'stock', title: s.name };
      if (!(tgt >= 0)) { liquids.push({ ...base, err: 'Saisissez la concentration finale.' }); continue; }
      const cs = conv(num(s.c), s.u, c.u, num(s.mw));
      if (cs == null) { liquids.push({ ...base, err: `Unités incompatibles (${s.u} → ${c.u}). Ajoutez la masse molaire à la mère.` }); continue; }
      if (!(cs > 0)) { liquids.push({ ...base, err: 'Concentration de la mère invalide.' }); continue; }
      const v = ce * Vf / cs;
      if (v > Vf + 1e-9) { liquids.push({ ...base, err: `Mère trop diluée : il faudrait ${fmtVol(v)} pour ${fmtVol(Vf)}.` }); sumV += v; continue; }
      sumV += v; if (s.solv === 'D2O') d2oIn += v;
      liquids.push({ ...base, amt: fmtVol(v), sub: `${fmtC(ce)} ${c.u} final, mère à ${fmtC(num(s.c))} ${s.u}${s.solv === 'D2O' ? ' dans D₂O' : ''}` });
      if (v > 0 && v < 0.0005) out.warns.push(`${s.name} : ${fmtVol(v)} est trop faible pour être pipeté. Faites une dilution intermédiaire de la mère.`);
    } else {
      const r = R(c.ref);
      if (!r) { solids.push({ key: c.uid, k: 'solid', title: 'Réactif supprimé', err: 'Retirez ce composant.' }); continue; }
      const f = r.forms[c.form] || r.forms[0]; const mw = num(f?.mw);
      const base = { key: c.uid, k: 'solid', title: rForm(r, c.form) };
      if (!(tgt >= 0)) { solids.push({ ...base, err: 'Saisissez la concentration finale.' }); continue; }
      const u = CU[c.u]; let g;
      if (u?.f === 'mol') {
        if (!(mw > 0)) { solids.push({ ...base, err: 'Masse molaire manquante.' }); continue; }
        g = ce * u.k * mw * Vf / 1000;
      } else if (u?.f === 'mass') g = ce * u.k * Vf / 1000;
      else { solids.push({ ...base, err: 'Unité non valable pour un solide.' }); continue; }
      hasSolid = true;
      solids.push({ ...base, amt: fmtMass(g), sub: `${r.name}, ${fmtMW(mw)} g/mol, ${fmtC(ce)} ${c.u} final` });
      if (g > 0 && g < 0.001) out.warns.push(`${r.formula} : ${fmtMass(g)} à peser, c’est en dessous de la précision d’une balance de paillasse. Préparez plutôt une solution mère.`);
    }
  }
  out.steps = [...solids, ...liquids];
  const d2oTot = P / 100 * Vf;
  let d2oAdd = d2oTot - d2oIn;
  if (d2oAdd < -1e-9) { out.warns.push(`Les mères dans D₂O apportent déjà ${fmtPct(d2oIn / Vf * 100)} % de D₂O, plus que les ${fmtPct(P)} % demandés.`); d2oAdd = 0; }
  if (d2oAdd > 1e-12) {
    const rho = num(S.reagents.find(r => r.solvent)?.density) || 1.107;
    out.steps.push({ key: 'd2o', k: 'd2o', title: 'D₂O', amt: fmtVol(d2oAdd), sub: `${fmtPct(P)} % v/v au total, soit environ ${fmtMass(d2oAdd * rho)}` });
  }
  const h2o = Vf - sumV - Math.max(d2oAdd, 0);
  if (h2o < -1e-9) out.steps.push({ key: 'h2o', k: 'h2o', title: 'H₂O', err: `Impossible : les volumes dépassent le volume final de ${fmtVol(-h2o)}.` });
  else out.steps.push({ key: 'h2o', k: 'h2o', title: hasSolid ? 'H₂O jusqu’au trait de jauge' : 'H₂O', amt: (hasSolid ? '≈ ' : '') + fmtVol(Math.max(h2o, 0)), sub: hasSolid ? `Complétez à ${fmtVol(Vf)} exactement, les solides occupent un peu de volume` : `Volume final ${fmtVol(Vf)}` });
  if (fx > 1 && P > 0) out.after = `Une fois dilué ${fmtC(fx)} fois dans H₂O, l’échantillon contiendra ${fmtPct(P / fx)} % de D₂O.`;
  return out;
}

const resBox = (label, val, extra = '') => `<div class="rounded-xl bg-accent/10 border border-accent/30 p-4"><div class="text-sm text-muted">${label}</div><div class="text-3xl font-bold text-accent num mt-0.5">${val}</div>${extra ? `<div class="text-sm mt-2">${extra}</div>` : ''}</div>`;
const hint = (t, err) => `<p class="text-sm ${err ? 'text-err' : 'text-muted'} rounded-xl border ${err ? 'border-err/30 bg-err/5' : 'border-line border-dashed'} p-3">${t}</p>`;
function renderC1() {
  const el = $('#c1res'); if (!el) return;
  const f = S.flash, keys = ['c1', 'v1', 'c2', 'v2'];
  const miss = keys.filter(k => !isFinite(num(f[k])));
  if (miss.length !== 1) { el.innerHTML = hint(miss.length === 0 ? 'Videz le champ que vous voulez calculer.' : `Encore ${miss.length - 1} valeur${miss.length > 2 ? 's' : ''} à saisir.`); return; }
  if (keys.some(k => k !== miss[0] && !(num(f[k]) > 0))) { el.innerHTML = hint('Les valeurs doivent être positives.', true); return; }
  const a = CU[f.u1], b = CU[f.u2];
  if (a.f !== b.f) { el.innerHTML = hint(`${f.u1} et ${f.u2} ne sont pas convertibles entre eux. Utilisez des unités de même nature.`, true); return; }
  const c1 = num(f.c1) * a.k, c2 = num(f.c2) * b.k, v1 = num(f.v1) * VU[f.vu1], v2 = num(f.v2) * VU[f.vu2];
  let label, val, V1 = v1, V2 = v2;
  switch (miss[0]) {
    case 'v1': V1 = c2 * v2 / c1; label = 'V₁ à pipeter'; val = fmtVol(V1); break;
    case 'v2': V2 = c1 * v1 / c2; label = 'V₂, volume final'; val = fmtVol(V2); break;
    case 'c1': label = 'C₁, concentration de la mère'; val = `${fmtC(c2 * v2 / v1 / a.k)} ${f.u1}`; break;
    case 'c2': label = 'C₂, concentration finale'; val = `${fmtC(c1 * v1 / v2 / b.k)} ${f.u2}`; break;
  }
  if (V1 > V2 * (1 + 1e-9)) { el.innerHTML = resBox(label, val) + hint('V₁ dépasse V₂ : la concentration finale doit être inférieure à celle de la mère.', true); return; }
  el.innerHTML = resBox(label, val, `${fmtVol(V1)} de mère + ${fmtVol(V2 - V1)} de diluant, dilution au 1/${fmtC(V2 / V1)}`);
}
function renderMass() {
  const el = $('#mres'); if (!el) return;
  const f = S.flash; let mw;
  if (f.mRef) { const r = R(f.mRef); const fo = r?.forms[f.mForm] || r?.forms[0]; mw = num(fo?.mw); } else mw = num(f.mMw);
  const C = num(f.mC), V = num(f.mV) * VU[f.mVU], u = CU[f.mU];
  if (!(C > 0 && V > 0)) { el.innerHTML = hint('Saisissez la concentration et le volume.'); return; }
  let g;
  if (u.f === 'mol') { if (!(mw > 0)) { el.innerHTML = hint('Indiquez la masse molaire.', true); return; } g = C * u.k * mw * V / 1000; }
  else g = C * u.k * V / 1000;
  const r = f.mRef ? R(f.mRef) : null;
  el.innerHTML = resBox('Masse à peser', fmtMass(g), `${r ? esc(rForm(r, f.mForm)) + ' ' : ''}pour ${fmtVol(V)} à ${fmtC(C)} ${f.mU}${u.f === 'mol' ? `, ${fmtMW(mw)} g/mol` : ''}`);
}

const phosCalc = p => { const C = num(p.c), pH = num(p.ph), pK = num(p.pka); if (!(C > 0) || !isFinite(pH) || !isFinite(pK)) return null; const r = 10 ** (pH - pK); return { base: C * r / (1 + r), acid: C / (1 + r), r }; };

/* ============ Actions ============ */
function addComp(kind, ref) {
  const c = { uid: uid(), kind, ref, c: '', u: 'mM' };
  if (kind === 'stock') { const s = ST(ref); const f = CU[s?.u]?.f; c.u = f === 'mol' ? 'mM' : (s?.u || 'mM'); }
  else c.form = R(ref)?.sel || 0;
  S.draft.comps.push(c); S.tab = 'buf'; persist(); render();
  setTimeout(() => { const i = document.querySelector(`[data-cin="c"][data-uid="${c.uid}"]`); if (i) { i.scrollIntoView({ block: 'center', behavior: 'smooth' }); i.focus({ preventScroll: true }); } }, 80);
}
function autoName(d) {
  const parts = d.comps.map(c => c.kind === 'stock' ? ST(c.ref)?.name.split(' ')[0] : R(c.ref)?.formula).filter(Boolean).slice(0, 4);
  return `Tampon ${fmtC(num(d.x) || 1)}X ${parts.join('/')}${num(d.d2o) > 0 ? ` ${fmtPct(num(d.d2o))} % D₂O` : ''}`.replace(/\s+/g, ' ').trim();
}
async function copyText(t) {
  try { await navigator.clipboard.writeText(t); return true; }
  catch (e) {
    const ta = document.createElement('textarea'); ta.value = t; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;opacity:0;top:0';
    document.body.appendChild(ta); ta.select(); let ok = false; try { ok = document.execCommand('copy'); } catch (_) { } ta.remove(); return ok;
  }
}
const exportData = () => JSON.stringify({ app: 'tampons-paillasse', version: 1, date: new Date().toISOString(), reagents: S.reagents, stocks: S.stocks, recipes: S.recipes }, null, 2);
function handleImport(txt) {
  let d; try { d = JSON.parse(txt); } catch (e) { toast('JSON illisible'); return; }
  if (!d || !(Array.isArray(d.reagents) || Array.isArray(d.stocks) || Array.isArray(d.recipes))) { toast('Ce fichier ne contient pas de données de tampons'); return; }
  pending = d; openSheet(sheetImport);
}
function cleanList(k, arr) {
  return (Array.isArray(arr) ? arr : []).filter(x => x && typeof x === 'object' && x.id &&
    (k !== 'reagents' || (Array.isArray(x.forms) && x.forms.length)) && (k !== 'recipes' || Array.isArray(x.comps)));
}
function applyTheme() {
  document.documentElement.dataset.theme = S.theme === 'light' ? 'light' : 'dark';
  $('#tc').setAttribute('content', S.theme === 'light' ? '#f0f3f7' : '#0f1620');
}

const A = {
  tab: el => { S.tab = el.dataset.t; persist(); render(); window.scrollTo(0, 0); },
  setDraft: el => { const k = el.dataset.k; S.draft[k] = k === 'vu' ? el.dataset.v : +el.dataset.v; persist(); render(); },
  newDraft: () => { if (S.draft.comps.length && !confirm('Effacer le tampon en cours ?')) return; S.draft = emptyDraft(); ticks.clear(); persist(); render(); },
  addSheet: () => openSheet(sheetAdd),
  addComp: el => { const { kind, ref } = el.dataset; closeSheet(); addComp(kind, ref); },
  rmComp: el => { S.draft.comps = S.draft.comps.filter(c => c.uid !== el.dataset.uid); ticks.delete(el.dataset.uid); persist(); render(); },
  setForm: el => { const c = comp(el.dataset.uid); if (!c) return; c.form = +el.dataset.i; const r = R(c.ref); if (r) r.sel = c.form; persist(); render(); },
  tick: el => { const k = el.dataset.k; ticks.has(k) ? ticks.delete(k) : ticks.add(k); renderResults(); },
  untick: () => { ticks.clear(); renderResults(); },
  phos: () => { edit = S.phos; openSheet(sheetPhos); },
  phosAdd: () => {
    const p = S.phos, res = phosCalc(p); if (!res) return toast('Paramètres invalides');
    const [b, a] = p.cat === 'K' ? ['r_k2hpo4', 'r_kh2po4'] : ['r_na2hpo4', 'r_nah2po4'];
    const rb = R(b), ra = R(a); if (!rb || !ra) return toast('Réactifs phosphate introuvables dans la base');
    S.draft.comps.push({ uid: uid(), kind: 'solid', ref: b, form: rb.sel || 0, c: +res.base.toPrecision(4), u: 'mM' },
      { uid: uid(), kind: 'solid', ref: a, form: ra.sel || 0, c: +res.acid.toPrecision(4), u: 'mM' });
    persist(); closeSheet(); render(); toast('Phosphate ajouté');
  },
  saveSheet: () => { edit = { name: S.draft.name || autoName(S.draft) }; openSheet(sheetSave); },
  saveRec: () => {
    const name = String(edit?.name || '').trim(); if (!name) return toast('Donnez un nom à la recette');
    const d = S.draft;
    const rec = { id: 'rc_' + uid(), name, vol: d.vol, vu: d.vu, x: d.x, d2o: d.d2o, comps: d.comps.map(({ uid, ...c }) => c) };
    const i = S.recipes.findIndex(r => r.name.trim().toLowerCase() === name.toLowerCase());
    if (i >= 0) { rec.id = S.recipes[i].id; S.recipes[i] = rec; } else S.recipes.unshift(rec);
    d.name = name; persist(); closeSheet(); render(); toast(i >= 0 ? 'Recette mise à jour' : 'Recette enregistrée');
  },
  loadRec: el => { const r = S.recipes.find(x => x.id === el.dataset.id); if (!r) return; S.draft = recipeToDraft(clone(r)); ticks.clear(); S.tab = 'buf'; persist(); render(); window.scrollTo(0, 0); toast('Recette chargée'); },
  delRec: el => { const r = S.recipes.find(x => x.id === el.dataset.id); if (!r || !confirm(`Supprimer « ${r.name} » ?`)) return; S.recipes = S.recipes.filter(x => x !== r); persist(); render(); toast('Recette supprimée'); },
  copyProto: () => {
    const d = S.draft, o = compute(d); if (o.fatal) return toast(o.fatal);
    const head = `${d.name || autoName(d)}\n${fmtVol(num(d.vol) * VU[d.vu])}, ${fmtC(num(d.x) || 1)}X, ${fmtPct(num(d.d2o) || 0)} % D₂O`;
    const lines = o.steps.map((s, i) => `${i + 1}. ${KB[s.k][0]} ${s.title} : ${s.err ? '⚠ ' + s.err : s.amt}${!s.err && s.sub ? ` (${s.sub})` : ''}`);
    copyText([head, '', ...lines, ...o.warns.map(w => '⚠ ' + w)].join('\n')).then(ok => toast(ok ? 'Protocole copié' : 'Copie impossible'));
  },
  stkTab: el => { ui.stk = el.dataset.v; render(); },
  newStock: el => { edit = { _new: true, _then: el.dataset.then || '', name: '', c: '', u: 'mM', solv: 'H2O', mw: '' }; openSheet(sheetStock); },
  editStock: el => { const s = ST(el.dataset.id); if (!s) return; edit = { ...s, c: dv(s.c), mw: dv(s.mw) }; openSheet(sheetStock); },
  edSet: el => { if (!edit) return; edit[el.dataset.k] = el.dataset.v; if (sheetFn === sheetPhos) persist(); drawSheet(); },
  saveStock: () => {
    const e = edit, name = String(e.name || '').trim(), c = num(e.c);
    if (!name) return toast('Donnez un nom à la mère');
    if (!(c > 0)) return toast('Concentration invalide');
    const s = { id: e._new ? 's_' + uid() : e.id, name, c, u: e.u, solv: e.solv, mw: num(e.mw) > 0 ? num(e.mw) : '' };
    const i = S.stocks.findIndex(x => x.id === s.id); if (i >= 0) S.stocks[i] = s; else S.stocks.push(s);
    const then = e._then; persist(); closeSheet();
    if (then === 'add') addComp('stock', s.id); else render();
    toast('Mère enregistrée');
  },
  delStock: () => {
    const used = S.recipes.filter(r => r.comps.some(c => c.kind === 'stock' && c.ref === edit.id)).length;
    if (!confirm(`Supprimer « ${edit.name} » ?${used ? `\nElle est utilisée dans ${used} recette(s).` : ''}`)) return;
    S.stocks = S.stocks.filter(s => s.id !== edit.id); persist(); closeSheet(); render(); toast('Mère supprimée');
  },
  newReagent: el => { edit = { _new: true, _then: el.dataset.then || '', name: '', formula: '', forms: [{ l: 'Anhydre', mw: '' }] }; openSheet(sheetReagent); },
  editReagent: el => { const r = R(el.dataset.id); if (!r) return; edit = clone(r); edit.forms.forEach(f => f.mw = dv(f.mw)); edit.density = dv(r.density); openSheet(sheetReagent); },
  addForm: () => { edit.forms.push({ l: '', mw: '' }); drawSheet(); },
  rmForm: el => { edit.forms.splice(+el.dataset.i, 1); drawSheet(); },
  saveReagent: () => {
    const e = edit, name = String(e.name || '').trim();
    if (!name) return toast('Donnez un nom au réactif');
    const forms = e.forms.map((f, i) => ({ l: subscript(String(f.l || '').trim()) || (i ? `Forme ${i + 1}` : 'Anhydre'), mw: num(f.mw) })).filter(f => f.mw > 0);
    if (!forms.length) return toast('Indiquez au moins une masse molaire');
    const r = { id: e._new ? 'r_' + uid() : e.id, name, formula: subscript(String(e.formula || '').trim()) || name, forms, sel: Math.min(+e.sel || 0, forms.length - 1), custom: e._new ? true : !!e.custom };

  exportCopy: () => copyText(exportData()).then(ok => toast(ok ? 'JSON copié dans le presse-papiers' : 'Copie impossible')),
  importText: () => { const t = $('[data-paste]')?.value.trim(); if (!t) return toast('Collez d’abord le JSON'); handleImport(t); },
  importDo: el => {
    const d = pending; if (!d) return;
    for (const k of ['reagents', 'stocks', 'recipes']) {
      const inc = cleanList(k, d[k]);
      if (el.dataset.m === 'replace') S[k] = inc;
      else { const m = new Map(S[k].map(x => [x.id, x])); inc.forEach(x => m.set(x.id, x)); S[k] = [...m.values()]; }
    }
    S.reagents.forEach(r => { r.sel = Math.min(+r.sel || 0, r.forms.length - 1); });
    pending = null; persist(); closeSheet(); render(); toast('Import terminé');
  },
  resetAll: () => {
    if (!confirm('Réinitialiser toutes les données ? Vos mères, réactifs et recettes seront remplacés par les valeurs par défaut.')) return;
    const theme = S.theme; S = defaults(); S.theme = theme; ticks.clear(); flush(); closeSheet(); render(); toast('Données réinitialisées');
  },
  closeSheet: () => closeSheet()
};

/* ============ Événements ============ */
function setPath(p, v) { const ks = p.split('.'); let o = S; for (let i = 0; i < ks.length - 1; i++) o = o[ks[i]]; o[ks[ks.length - 1]] = v; }
function onField(t) {
  const ds = t.dataset;
  if (ds.in) {
    setPath(ds.in, t.value); persist();
    if (ds.in.startsWith('draft.')) { syncChips(); renderResults(); }
    else if (ds.in === 'flash.mRef') { S.flash.mForm = R(t.value)?.sel || 0; render(); }
    else if (ds.in.startsWith('flash.')) { renderC1(); renderMass(); }
  } else if (ds.cin) {
    const c = comp(ds.uid); if (c) { c[ds.cin] = t.value; persist(); renderResults(); }
  } else if (ds.ed) {
    if (edit) { edit[ds.ed] = t.value; if (sheetFn === sheetPhos) { persist(); updatePhos(); } }
  } else if (ds.fe) {
    if (edit && edit.forms[+ds.i]) edit.forms[+ds.i][ds.fe] = t.value;
  } else if ('search' in ds) {
    const q = norm(t.value.trim()), root = t.closest('#sheetBody') || $('#view');
    root.querySelectorAll('.srch').forEach(n => { n.style.display = !q || (n.dataset.name || '').includes(q) ? '' : 'none'; });
  }
}
document.addEventListener('input', e => { if (e.target.tagName !== 'SELECT') onField(e.target); });
document.addEventListener('change', e => {
  const t = e.target;
  if (t.tagName === 'SELECT') onField(t);
  else if ('file' in t.dataset && t.files && t.files[0]) {
    const fr = new FileReader(); fr.onload = () => handleImport(String(fr.result)); fr.readAsText(t.files[0]); t.value = '';
  }
});
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]'); if (!el) return;
  const f = A[el.dataset.a]; if (f) { e.preventDefault(); f(el, e); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && sheetFn) closeSheet();
  if (e.key === 'Enter' && e.target.tagName === 'INPUT' && e.target.getAttribute('inputmode') === 'decimal') e.target.blur();
});

let tt = null;
function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.remove('opacity-0'); clearTimeout(tt); tt = setTimeout(() => t.classList.add('opacity-0'), 1900); }

/* ============ Démarrage ============ */
$('#logo').innerHTML = ICON.beaker; $('#gear').innerHTML = ICON.gear;
applyTheme(); render();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
if (!storageOK) toast('Stockage local indisponible : exportez vos données');
</script>
